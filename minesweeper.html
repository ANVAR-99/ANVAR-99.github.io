<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.documentElement.classList.add('minesweeper-embed-mode');
    }
  </script>
  <title>Minesweeper - Anvar Nabili</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="minesweeper.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo"><a href="index.html" class="minesweeper-logo-link">Anvar Nabili</a></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="https://www.linkedin.com/in/anvar-nabili-9962a3397/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://github.com/ANVAR-99" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <main class="minesweeper-main">
    <div class="minesweeper-panel">
      <h1 class="minesweeper-title">Minesweeper</h1>
      <p class="minesweeper-help">8 × 8 grid, 10 mines. <strong>Desktop:</strong> left-click to reveal, right-click to flag. <strong>Phone:</strong> tap to reveal; press and hold (~half a second) to flag.</p>
      <div class="minesweeper-toolbar">
        <div class="minesweeper-counter" aria-live="polite">
          <span class="minesweeper-counter-label">Mines</span>
          <span id="mines-left" class="minesweeper-counter-value">10</span>
        </div>
        <button type="button" id="minesweeper-reset" class="minesweeper-reset">New game</button>
        <p id="minesweeper-status" class="minesweeper-status" role="status"></p>
      </div>
      <div id="minesweeper-board" class="minesweeper-board" aria-label="Minesweeper board"></div>
    </div>
  </main>

  <script src="Minesweeper.js"></script>
</body>
</html>
